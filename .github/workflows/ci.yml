name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - 'work/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply compatible dependency security fixes
        run: npm audit fix --package-lock-only

      - name: Commit patched dependency lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Fix vulnerable dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Dependency lockfile is already up to date"
          fi

      - name: Reinstall patched dependencies
        run: npm ci

      - name: Verify dependency security
        run: npm audit --audit-level=moderate

      - name: Unit tests and build
        run: npm run check

      - name: Start multiplayer server
        env:
          AUTH_REGISTRATION_LIMIT_PER_HOUR: 40
        run: |
          npm run start -w @hackatec/server > /tmp/hackatec-server.log 2>&1 &
          echo $! > /tmp/hackatec-server.pid

      - name: Wait for health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3001/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 0.5
          done

          echo "Server did not become healthy"
          cat /tmp/hackatec-server.log || true
          exit 1

      - name: Multiplayer Socket.IO smoke test
        run: npm run smoke -w @hackatec/game

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/hackatec-server.log || true
